name: contribution gate

# #1772 (open-rules.md §8 Phase B2): automated provenance + schema checks
# on every pull request to this repository. A green run here is a
# PRECONDITION for human review (see CONTRIBUTING.md's "Human review"
# section) — it is never a substitute for it. Nothing in this workflow
# merges a PR; only a human does that.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  template-check:
    runs-on: ubuntu-latest
    steps:
      - name: Reject an unfilled PR template
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const placeholder = '<!-- fill in, do not leave as-is -->';
            if (body.includes(placeholder)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: 'Closing: the pull request template has an unfilled field (the placeholder comment is still present). Please open a new PR with every template field completed — see CONTRIBUTING.md.',
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed',
              });
              core.setFailed('PR template has an unfilled placeholder field.');
            }

  provenance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Codex review, PR #1803 round 1, P1 [Authorization/data isolation]
      # "Run the base gate implementation": invokes base/'s copy of the
      # gate (the repo's own already-reviewed code), never head/'s — a PR
      # cannot neuter the validator that would otherwise reject it by
      # editing the validator itself in the same diff. base/'s copy of the
      # gate has zero external dependencies (allowlist.mjs; see that
      # module's own header comment), so no install step is needed even
      # though this repo has no package.json/lockfile.
      - name: Run the contribution gate
        run: node base/.github/gate/cli.mjs --base base --head head --allowlist base/.github/source-domains.json
